<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>CMD Bridge — konsola</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%230d1117'/%3E%3Ctext x='2' y='12' font-family='monospace' font-size='11' fill='%233fb950'%3E%26gt;_%3C/text%3E%3C/svg%3E">
<!--
  SAMODZIELNA STRONA-POŚREDNIK do CMD Bridge.

  Wgraj ten jeden plik na swój hosting (np. https://twoja-strona/cmd/console.html).
  Nie potrzebuje niczego więcej - ani PHP, ani bazy, ani bibliotek zewnętrznych.

  Strona sama NIE dotyka CMD. Rozmawia po AJAX z relayem, a relay przekazuje
  polecenia do tunelu na PC:

      ta strona  ==AJAX==>>  RELAY  ==kolejka==>>  TUNEL na PC  ==>>  CMD

  Wejście z tokenem (link, który dajesz AI lub sobie):

      https://twoja-strona/cmd/console.html?relay=https://relay.twoja-domena&token=ACCESS

  Adres relaya i token zapamiętują się w przeglądarce, więc następnym razem
  wystarczy sam adres strony. Jeśli chcesz mieć adres relaya wpisany na sztywno,
  ustaw go niżej w RELAY_DEFAULT.

  WAŻNE: relay musi zezwalać tej domenie na CORS. Uruchom go z:
      python -m cmdbridge.relay --allow-origin https://twoja-strona
  (domyślne '*' też zadziała).
-->
<style>
  :root {
    color-scheme: dark;
    --bg: #0d1117; --panel: #161b22; --line: #30363d; --ink: #c9d1d9;
    --dim: #8b949e; --acc: #58a6ff; --ok: #3fb950; --bad: #f85149; --warn: #d29922;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-size: 14px;
         font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  header { display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
           padding: 10px 16px; background: var(--panel); border-bottom: 1px solid var(--line); }
  header h1 { font-size: 15px; margin: 0; font-weight: 600; color: #e6edf3; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--dim); flex: none; }
  .dot.on { background: var(--ok); box-shadow: 0 0 6px var(--ok); }
  .dot.off { background: var(--bad); }
  .spacer { flex: 1; }
  .muted { color: var(--dim); font-size: 12px; }
  main { padding: 12px 16px 24px; max-width: 1100px; margin: 0 auto; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 8px; }
  label { font-size: 12px; color: var(--dim); }
  input, select, textarea, button {
    font-family: inherit; font-size: 13px; color: var(--ink); background: var(--bg);
    border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--acc); }
  textarea { width: 100%; min-height: 68px; resize: vertical; line-height: 1.5; }
  input.s { width: 92px; } input.m { width: 150px; }
  button { background: #238636; border-color: #2ea043; color: #fff; cursor: pointer; font-weight: 600; }
  button:hover:not(:disabled) { background: #2ea043; }
  button.ghost { background: #21262d; border-color: var(--line); color: var(--ink); font-weight: 400; }
  button.ghost:hover:not(:disabled) { background: #30363d; }
  button:disabled { opacity: .45; cursor: default; }
  .meta { font-size: 12px; color: var(--dim); margin: 8px 0 4px; min-height: 17px; line-height: 1.6; }
  pre { background: #010409; border: 1px solid var(--line); border-radius: 8px; padding: 12px;
        white-space: pre-wrap; word-break: break-word; margin: 0; font-size: 12.5px;
        line-height: 1.5; max-height: 62vh; overflow-y: auto; }
  .ok { color: var(--ok); } .bad { color: var(--bad); } .warn { color: var(--warn); }
  .card { max-width: 480px; margin: 48px auto; background: var(--panel);
          border: 1px solid var(--line); border-radius: 10px; padding: 22px; }
  .card h2 { margin: 0 0 6px; font-size: 16px; color: #e6edf3; }
  .card p { margin: 0 0 14px; font-size: 12.5px; color: var(--dim); line-height: 1.6; }
  .card input { width: 100%; margin-bottom: 10px; }
  .card button { width: 100%; }
  .err { color: var(--bad); font-size: 12px; min-height: 16px; margin-top: 8px; }
  code { background: #010409; padding: 1px 5px; border-radius: 4px; font-size: 12px; }
  details { margin-bottom: 10px; }
  summary { cursor: pointer; font-size: 12px; color: var(--dim); user-select: none; }
  summary:hover { color: var(--ink); }
  .hist { font-size: 12px; }
</style>
</head>
<body>

<!-- ================= EKRAN LOGOWANIA ================= -->
<div class="card" id="login" hidden>
  <h2>CMD Bridge — dostęp</h2>
  <p>Podaj adres relaya i token dostępu. Zostaną zapamiętane w tej przeglądarce.
     Zwykle dostajesz je gotowe w linku po <code>?relay=…&amp;token=…</code>.</p>
  <input id="inRelay" placeholder="https://relay.twoja-domena" autocomplete="off" spellcheck="false">
  <input id="inToken" type="password" placeholder="token dostępu" autocomplete="off">
  <button id="btnLogin">Połącz</button>
  <div class="err" id="loginErr"></div>
</div>

<!-- ================= KONSOLA ================= -->
<div id="app" hidden>
<header>
  <span class="dot" id="dot"></span>
  <h1>CMD Bridge</h1>
  <span class="muted" id="wstat">łączenie…</span>
  <span class="spacer"></span>
  <span class="muted" id="relayInfo"></span>
  <button class="ghost" id="btnLogout" style="padding:4px 8px;font-size:12px">wyloguj</button>
</header>
<main>
  <div class="row">
    <label>sesja</label><input id="sess" class="s" value="main">
    <label>widok</label>
    <select id="view">
      <option value="auto">auto</option>
      <option value="errors">errors</option>
      <option value="summary">summary</option>
      <option value="tail">tail</option>
      <option value="head">head</option>
      <option value="grep">grep</option>
      <option value="around">around</option>
      <option value="full">full</option>
      <option value="quiet">quiet</option>
    </select>
    <label>pattern</label><input id="pattern" class="m" placeholder="(dla grep)">
    <label>timeout</label><input id="to" class="s" type="number" value="120" min="1" max="3600">
  </div>
  <div class="row">
    <label><input type="checkbox" id="auto"> podgląd na żywo co</label>
    <input id="interval" class="s" type="number" value="3" min="1" max="60">
    <span class="muted">s</span>
    <span class="spacer"></span>
    <button class="ghost" id="btnLogs">/logs ostatniego</button>
    <button class="ghost" id="btnClear">wyczyść</button>
  </div>

  <textarea id="cmd" placeholder="Polecenie — Ctrl+Enter uruchamia, ↑/↓ przewija historię&#10;np. gradlew.bat assembleDebug --console=plain"></textarea>

  <div class="row">
    <button id="btnRun">Uruchom ▶</button>
    <button class="ghost" id="btnInt">przerwij</button>
    <button class="ghost" id="btnRestart">restart sesji</button>
    <button class="ghost" id="btnSessions">sesje</button>
    <span class="spacer"></span>
    <span class="muted" id="cwd"></span>
  </div>

  <div class="meta" id="meta"></div>
  <pre id="out"></pre>
</main>
</div>

<script>
(function () {
  "use strict";

  // Ustaw tutaj, jeśli chcesz mieć adres relaya na sztywno w pliku:
  var RELAY_DEFAULT = "";

  var $ = function (id) { return document.getElementById(id); };
  var LS = { relay: "cmdbridge.relay", token: "cmdbridge.token" };

  var relay = "", token = "", connected = false;
  var busy = false, offsets = {}, history = [], histPos = -1, tickCount = 0;

  // ---------------------------------------------------------------- pomocnicze

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>]/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c];
    });
  }

  function normalizeUrl(u) {
    u = (u || "").trim().replace(/\/+$/, "");
    if (u && !/^https?:\/\//i.test(u)) u = "https://" + u;
    return u;
  }

  function saveCreds(r, t) {
    relay = r; token = t;
    try { localStorage.setItem(LS.relay, r); localStorage.setItem(LS.token, t); } catch (e) {}
  }

  function clearCreds() {
    try { localStorage.removeItem(LS.relay); localStorage.removeItem(LS.token); } catch (e) {}
    relay = ""; token = ""; connected = false;
  }

  // ------------------------------------------------------------------ warstwa API

  function api(path, opts) {
    // Bez adresu relaya fetch poleciałby pod własny origin strony (i trafił w 404
    // twojego hostingu), więc odcinamy to od razu.
    if (!relay) return Promise.reject(new Error("brak adresu relaya"));
    opts = opts || {};
    opts.headers = Object.assign({ "Content-Type": "application/json",
                                   "X-Bridge-Token": token }, opts.headers || {});
    return fetch(relay + path, opts);
  }

  // Zgłoś polecenie i poczekaj na wynik. Relay zwraca 204, dopóki wynik nie
  // jest gotowy — wtedy pytamy dalej, aż przyjdzie 200.
  async function call(request, waitSec) {
    var r = await api("/api/submit", { method: "POST", body: JSON.stringify(request) });
    if (r.status === 401) { showLogin("Token odrzucony przez relay."); throw new Error("401"); }
    var j = await r.json();
    if (!j.id) throw new Error(j.error || "relay nie przyjął żądania");
    var wait = waitSec || 25;
    for (;;) {
      var res = await api("/api/result?id=" + encodeURIComponent(j.id) + "&wait=" + wait);
      if (res.status === 204) continue;               // wciąż w toku
      if (res.status === 401) { showLogin("Token odrzucony."); throw new Error("401"); }
      return await res.json();
    }
  }

  // ------------------------------------------------------------------ rysowanie

  function renderResult(res) {
    if (!res) { $("meta").innerHTML = '<span class="bad">brak odpowiedzi</span>'; return; }
    var bits = [];
    if (res.exit_code !== undefined && res.exit_code !== null) {
      bits.push('<span class="' + (res.exit_code === 0 ? "ok" : "bad") + '">exit=' + res.exit_code + "</span>");
    } else if (res.timed_out) {
      bits.push('<span class="warn">exit=? (timeout)</span>');
    }
    if (res.verdict) bits.push("werdykt=" + esc(res.verdict));
    if (res.status_line) bits.push(esc(res.status_line));
    if (res.duration != null) bits.push(res.duration + "s");
    if (res.view) bits.push("widok=" + esc(res.view));
    if (res.lines_total != null) bits.push("linii=" + res.lines_total);
    if (res.matches != null) bits.push("trafień=" + res.matches);
    if (res.seq != null) bits.push("seq=" + res.seq);
    if (res.error) bits.push('<span class="bad">' + esc(res.error) + "</span>");
    if (res.hint) bits.push('<span class="warn">' + esc(res.hint) + "</span>");
    $("meta").innerHTML = bits.join(" · ");
    if (res.cwd) $("cwd").textContent = res.cwd;

    var text = res.output != null ? res.output : (res.text != null ? res.text : "");

    // Znaleziska z widoku errors pokazujemy na górze, zwięźle.
    if (res.findings && res.findings.length) {
      var head = res.findings.map(function (f) {
        var loc = f.file ? " " + f.file + (f.line ? ":" + f.line : "") : "";
        return "[" + (f.severity || "error") + "]" + loc + " " + (f.message || "")
             + (f.log_line ? "  (log:" + f.log_line + ")" : "")
             + (f.count > 1 ? "  x" + f.count : "");
      }).join("\n");
      text = head + (text ? "\n\n" + text : "");
    }
    if (res.artifacts && res.artifacts.length) {
      text += "\n\nartefakty:\n  " + res.artifacts.join("\n  ");
    }
    $("out").textContent = text || "(brak wyjścia)";
    $("out").scrollTop = 0;
  }

  function setBusy(on) {
    busy = on;
    $("btnRun").disabled = on;
    $("btnRun").textContent = on ? "wykonuję…" : "Uruchom ▶";
  }

  function buildViewFields(req) {
    var v = $("view").value;
    req.view = v;
    if (v === "grep" && $("pattern").value) req.pattern = $("pattern").value;
    return req;
  }

  // ------------------------------------------------------------------ akcje

  async function runCommand() {
    var command = $("cmd").value.trim();
    if (!command || busy) return;
    setBusy(true);
    $("meta").textContent = "wysyłam do PC…";
    if (history[history.length - 1] !== command) history.push(command);
    histPos = history.length;
    try {
      var req = buildViewFields({
        op: "run", command: command,
        session: $("sess").value || "main",
        timeout: parseInt($("to").value, 10) || 120
      });
      renderResult(await call(req, 25));
      offsets[$("sess").value || "main"] = 0;
    } catch (e) {
      if (e.message !== "401") $("meta").innerHTML = '<span class="bad">' + esc(e.message) + "</span>";
    } finally { setBusy(false); }
  }

  async function simpleOp(request, label, wait) {
    if (busy) return;
    setBusy(true);
    $("meta").textContent = label + "…";
    try { renderResult(await call(request, wait || 15)); }
    catch (e) { if (e.message !== "401") $("meta").innerHTML = '<span class="bad">' + esc(e.message) + "</span>"; }
    finally { setBusy(false); }
  }

  // ------------------------------------------------------------------ pętla stanu

  async function pollStatus() {
    if (!connected) return;
    try {
      var r = await api("/api/status");
      if (r.status === 401) { showLogin("Token odrzucony."); return; }
      var s = await r.json();
      $("dot").className = "dot " + (s.worker_online ? "on" : "off");
      $("wstat").textContent = s.worker_online
        ? "PC online" + (s.pending ? " · w kolejce: " + s.pending : "")
        : "PC offline" + (s.worker_last_seen != null ? " (ost. " + s.worker_last_seen + "s temu)" : "");
    } catch (e) {
      $("dot").className = "dot off";
      $("wstat").textContent = "brak łączności z relayem";
    }
  }

  async function pollOutput() {
    if (!connected || !$("auto").checked || busy) return;
    var sess = $("sess").value || "main";
    try {
      var res = await call({ op: "output", session: sess, since: offsets[sess] || 0 }, 5);
      if (res && res.ok) {
        offsets[sess] = res.offset || 0;
        if (res.text) {
          var box = $("out");
          var atBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 40;
          box.textContent += res.text;
          if (atBottom) box.scrollTop = box.scrollHeight;
        }
      }
    } catch (e) { /* cicho — to tylko podgląd */ }
  }

  var loopStarted = false;
  function startLoop() {
    if (loopStarted) return;          // ponowne logowanie nie mnoży timerów
    loopStarted = true;
    setInterval(function () {
      tickCount++;
      var iv = Math.max(1, parseInt($("interval").value, 10) || 3);
      if (tickCount % 3 === 0) pollStatus();
      if (tickCount % iv === 0) pollOutput();
    }, 1000);
    pollStatus();
  }

  // ------------------------------------------------------------------ ekrany

  function showLogin(message) {
    connected = false;                // zatrzymuje odpytywanie w tle
    $("app").hidden = true;
    $("login").hidden = false;
    $("loginErr").textContent = message || "";
    $("inRelay").value = relay || RELAY_DEFAULT;
    $("inToken").value = "";
    $("dot").className = "dot";
    $("wstat").textContent = "rozłączono";
  }

  function showApp() {
    connected = true;
    $("login").hidden = true;
    $("app").hidden = false;
    try { $("relayInfo").textContent = new URL(relay).host; } catch (e) { $("relayInfo").textContent = relay; }
    $("cmd").focus();
  }

  async function tryConnect(r, t) {
    r = normalizeUrl(r);
    if (!r) { $("loginErr").textContent = "Podaj adres relaya."; return; }
    if (!t) { $("loginErr").textContent = "Podaj token dostępu."; return; }
    $("loginErr").textContent = "sprawdzam…";
    var prevRelay = relay, prevToken = token;
    relay = r; token = t;
    try {
      var res = await api("/api/status");
      if (res.status === 401) { relay = prevRelay; token = prevToken;
        $("loginErr").textContent = "Relay odrzucił token."; return; }
      if (!res.ok) { relay = prevRelay; token = prevToken;
        $("loginErr").textContent = "Relay odpowiedział kodem " + res.status + "."; return; }
      saveCreds(r, t);
      showApp();
      startLoop();
    } catch (e) {
      relay = prevRelay; token = prevToken;
      $("loginErr").textContent = "Nie mogę połączyć się z relayem. Sprawdź adres, HTTPS i CORS "
        + "(uruchom relay z --allow-origin " + location.origin + ").";
    }
  }

  // ------------------------------------------------------------------ zdarzenia

  $("btnRun").onclick = runCommand;
  $("btnClear").onclick = function () {
    $("out").textContent = ""; $("meta").textContent = ""; };
  $("btnInt").onclick = function () {
    simpleOp({ op: "interrupt", session: $("sess").value || "main" }, "przerywam", 10); };
  $("btnRestart").onclick = function () {
    offsets[$("sess").value || "main"] = 0;
    simpleOp({ op: "restart", session: $("sess").value || "main" }, "restartuję sesję", 15); };
  $("btnSessions").onclick = function () {
    simpleOp({ op: "sessions" }, "pobieram listę sesji", 10); };
  $("btnLogs").onclick = function () {
    simpleOp(buildViewFields({ op: "logs", session: $("sess").value || "main", seq: "last" }),
             "czytam log", 20); };
  $("btnLogout").onclick = function () { clearCreds(); showLogin("Wylogowano."); };

  $("cmd").addEventListener("keydown", function (e) {
    if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) { e.preventDefault(); runCommand(); return; }
    if (e.key === "ArrowUp" && e.ctrlKey && history.length) {
      e.preventDefault(); histPos = Math.max(0, histPos - 1); $("cmd").value = history[histPos] || ""; }
    if (e.key === "ArrowDown" && e.ctrlKey && history.length) {
      e.preventDefault(); histPos = Math.min(history.length, histPos + 1);
      $("cmd").value = histPos >= history.length ? "" : history[histPos]; }
  });

  $("btnLogin").onclick = function () { tryConnect($("inRelay").value, $("inToken").value); };
  $("inToken").addEventListener("keydown", function (e) {
    if (e.key === "Enter") $("btnLogin").click(); });

  // ------------------------------------------------------------------ start

  (function boot() {
    var qs = new URLSearchParams(location.search);
    var qRelay = qs.get("relay") || "";
    var qToken = qs.get("token") || "";
    var stored = {};
    try { stored.relay = localStorage.getItem(LS.relay) || "";
          stored.token = localStorage.getItem(LS.token) || ""; } catch (e) {}

    var r = normalizeUrl(qRelay || stored.relay || RELAY_DEFAULT);
    var t = qToken || stored.token || "";

    // Token z adresu chowamy z paska — żeby nie wyciekł przez historię czy zrzut ekranu.
    if (qToken && window.history.replaceState) {
      window.history.replaceState({}, "", location.pathname);
    }

    if (r && t) { tryConnect(r, t); }
    else { relay = r; showLogin(""); }
  })();
})();
</script>
</body>
</html>

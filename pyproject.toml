[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cmdbridge"
version = "1.1.0"
description = "Pośrednik między wierszem poleceń (CMD) a modelem AI bez bezpośredniego dostępu do powłoki"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
keywords = ["cmd", "shell", "ai", "bridge", "automation"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Shells",
]
dependencies = []

[project.scripts]
cmdbridge = "cmdbridge.app:main"
cmdbridge-client = "cmdbridge.client:main"
cmdbridge-relay = "cmdbridge.relay:main"

[tool.setuptools]
packages = ["cmdbridge"]
